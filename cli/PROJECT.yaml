# The client binaries: runko (human/agent CLI) and runko-ci (CI-facing
# CLI). Pure main packages over the platform libraries.
#
# Checks are OWNED here (§14.9): scoped to //cli/... . No -race check on
# purpose (race-where-it-matters): these are sequential CLIs - the
# concurrent surfaces (land engine, daemon) carry their own race checks,
# and a change touching platform code pulls those in via the closure.
schema: project/v1
name: cli
type: app
language: go
# release (§14.10.3): the CLI is the platform's first released project -
# `runko release create --project cli` cuts cli/vX.Y.Z with a changelog
# derived from the landed Changes touching this folder.
# deploy.binaries (docs/spec/deploy/README.md, 2026-07-24): the rolling
# cli-latest GitHub release. `runko-ci binaries` republishes it whenever
# THIS project is in the affected closure - the manifest's dependency
# edges below are the whole trigger rule, replacing the binary-release
# workflow's hand-maintained project list (paths default to cli/runko and
# cli/runko-ci).
capabilities:
  - release
  - deploy
capability_config:
  deploy:
    binaries:
      tag: cli-latest
      items:
        - name: runko
        - name: runko-ci
# templates: `runko ci init` writes the workflow templates by embedding
# the templates/ci package verbatim, so this binary does not build without
# that tree - a build-grade edge, and the reason a --project cli workspace
# used to be born unbuildable (2026-07-24).
dependencies:
  - platform
  - internal
  - templates
# runkod was `consumes` until 2026-07-24 (the REST-client reading of
# §13.3.1) - but cli's e2e tests import and RUN the daemon package, and no
# contract-scoped closure covers that: a --project cli workspace
# materialized runkod/proto and nothing else, so those tests could not
# build. A test_dependency rather than a dependency because ONLY cli's own
# checks link the daemon - the shipped binaries speak to it over HTTP - so
# a daemon change requires cli-test without dragging in everything that
# depends on cli.
test_dependencies:
  - runkod
ci:
  checks:
    - name: cli-test
      command: bazel test --test_output=errors //cli/...
    - name: bazel-check
      command: make check-bazel
